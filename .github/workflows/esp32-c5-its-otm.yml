name: esp32-c5-its-otm

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: esp32-c5-its-otm

    steps:
    - name: checkout code
      uses: actions/checkout@v4

    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libmosquitto-dev libmosquittopp-dev libssl-dev

    - name: build
      run: make

    - name: create zip
      uses: actions/upload-artifact@v4
      with:
        name: esp32-c5-its-otm
        path: |
          esp32-c5-its-otm/esp32-c5-its-otm
        retention-days: 30
