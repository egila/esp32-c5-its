name: esp32-c5-its-rx

on:
  push:
    branches: [ "main" ]
    paths:
      - 'esp32-c5-its-rx/**'
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'esp32-c5-its-rx/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: esp32-c5-its-rx

    steps:
    - name: checkout code
      uses: actions/checkout@v4

    - name: setup python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: install platformio
      run: |
        python -m pip install --upgrade pip
        pip install -U platformio

    - name: build all
      run: pio run

    - name: create download
      uses: actions/upload-artifact@v4
      with:
        name: esp32-c5-its-rx
        path: |
          esp32-c5-its-rx/.pio/build/*/firmware.bin
          esp32-c5-its-rx/.pio/build/*/firmware.factory.bin
        retention-days: 30
