name: PlatformIO CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: esp32-c5-its-rx

    steps:
    - name: checkout code
      uses: actions/checkout@v4

    - name: setup python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: install platformio
      run: |
        python -m pip install --upgrade pip
        pip install -U platformio

    - name: build all
      run: pio run

    - name: create download
      uses: actions/upload-artifact@v4
      with:
        name: firmware-binary
        path: esp32-c5-its-rx/.pio/build/*/*.bin
        retention-days: 30
